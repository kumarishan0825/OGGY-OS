<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGGY-OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="os-env">
    <header class="Header_Menu">
        <div class="Menu_Bar">
          
            <h1 style="margin-left: 24px;">OGGY-OS</h1>
            <p id="timeElement" class="time-box" style="margin-right: 24px;">
                Time
            </p>
        </div>
    </header>
    <div class="desk-content" id="welcome">
    <div id="mydiv">
        <div id="mydivheader">
            <a href="#"><img src="icons8-google-logo-48.png" alt="">Google</a>
        </div>
        </div>
        
        <div id="googlewindow" class="windowpanel">
            <div id="googleheader" class="windowheader">
                <div class="windowtitle">Google</div>
                <button class="window-close-button" id="google-close-button">&times;</button>
            </div>
            <div class="windowcontent">
                <iframe src="https://www.google.com/webhp?igu=1" frameborder="0"></iframe>
            </div>
        </div>

    </div>
</div>
    
    <script src="script.js"></script>
    <script>
        function updateTime() {
            var currentTime = new Date().toLocaleString();
            var timeText = document.getElementById("timeElement");
            timeText.innerHTML = currentTime;
        }
        setInterval(updateTime, 1000); 

    </script>
    
</body>
</html>
